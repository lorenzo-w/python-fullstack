services:
  web-gui:
    build: .
    command: "uv run vtr serve-streamlit"
    volumes:
      - app-data:/app/data
    ports:
      - 7000:7000
    restart: unless-stopped
    depends_on:
      - db

  rest-api:
    build: .
    command: "uv run vtr serve-fastapi-prod"
    environment:
      APP_DB_URL: "postgresql://app:app@db/app"
    volumes:
      - app-data:/app/data
    ports:
      - 8000:8000
    restart: unless-stopped
    depends_on:
      - db

  docs:
    build: .
    command: "uv run vtr serve-docs-prod"
    environment:
      SITE_URL: "http://127.0.0.1:9000"
    ports:
      - 9000:9000
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_DB}"
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  app-data: {}
  db-data: {}
